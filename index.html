<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Ruta Arcade Pixel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="mobile-app">
    <header class="top-bar">
      <h1>🚗 Ruta Arcade Pixel</h1>
      <div class="score-chip">Puntaje: <span id="score">0</span></div>
    </header>

    <main class="game-shell">
      <canvas id="gameCanvas" width="360" height="640"></canvas>
    </main>

    <section class="touch-controls">
      <button id="leftBtn" aria-label="Mover a la izquierda">⬅</button>
      <button id="rightBtn" aria-label="Mover a la derecha">➡</button>
    </section>

    <p class="mobile-hint">Deslizá con los botones para esquivar los autos.</p>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="modal-card">
      <div id="formStep">
        <h2>Game Over</h2>
        <p class="modal-text">Completá tus datos para guardar tu puntaje.</p>

        <form id="scoreForm">
          <input type="text" id="nombre" placeholder="Nombre" maxlength="40" required />
          <input type="text" id="apellido" placeholder="Apellido" maxlength="40" required />
          <input type="tel" id="telefono" placeholder="Celular" maxlength="25" required />
          <button type="submit" class="primary-btn">Guardar puntaje</button>
        </form>

        <div id="saveMessage" class="save-message"></div>
      </div>

      <div id="rankingStep" class="hidden">
        <h2>🏆 Ranking</h2>
        <p class="modal-text">Tu puntaje fue guardado correctamente.</p>
        <div id="leaderboardList" class="leaderboard-list"></div>
      </div>

      <button id="restartBtn" class="secondary-btn">Jugar otra vez</button>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="game.js"></script>
</body>
</html>
  <script src="api.js"></script>
  <script src="game.js"></script>
</body>
</html>
